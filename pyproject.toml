[project]
name = "seu-lecture-auto"
version = "1.0.0"
description = "校园讲座自动预约：CAS 登录、验证码识别、定时抢位、邮件通知"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32,<3",
    "cryptography>=43",
    # 回退用的通用 OCR；有专用模型时不会加载
    "ddddocr>=1.5,<2",
    # 专用模型推理（seu_lecture/models/captcha.onnx），也可由 ddddocr 带出，但显式声明
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "pillow>=10,<13",
    "python-dotenv>=1,<2",
    "apscheduler>=3.10,<4",
    "tzdata",
]

[tool.uv]
package = false
